name: Daily HubSpot pull (pipeline matrix)

on:
  schedule:
    # 09:xx UTC (4-5am ET), off the :00 mark. GitHub delays scheduled runs by hours at the top of the hour, so this aims to land by ~7am ET.
    - cron: "27 9 * * *"
  workflow_dispatch: {}

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run pull:matrix
        env:
          HUBSPOT_PRIVATE_APP_TOKEN: ${{ secrets.HUBSPOT_PRIVATE_APP_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
